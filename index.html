<!doctype html>
<html lang="en">
<head>
<title>Fiber Club</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#ffffff;--text:#1c1c1e;--muted:#5f6368;--accent:#3d7a24;--line:#e3e3e6}
@media (prefers-color-scheme: dark){:root{--bg:#111214;--text:#ececee;--muted:#a1a1a8;--accent:#a9db8c;--line:#2a2b2f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:2rem;line-height:1.2;margin:0 0 8px}
h2{font-size:1.2rem;margin:32px 0 8px}
p,li{margin:0 0 12px}
ul{padding-left:22px}
a{color:var(--accent)}
.muted{color:var(--muted);font-size:.95rem}
nav{margin-bottom:32px;font-size:.95rem}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>Fiber Club</h1>
<p>A fiber-first food diary for iPhone. Log what you eat, see your fiber for the day, and find easy foods to get more of it.</p>
<ul>
<li><a href="privacy/">Privacy policy</a></li>
<li><a href="terms/">Terms of use</a></li>
<li><a href="support/">Support</a></li>
</ul>
<footer>Fiber Club by Sofya Mikhaylova. <a href="mailto:m.sofiyka@gmail.com">m.sofiyka@gmail.com</a></footer>
</main>
</body>
</html>
